
# Netlify Configuration for Single Page App + Backend API
[build]
  publish = "dist"
  command = "npm run build"

# Forward API requests to the working Render backend
[[redirects]]
  from = "/api/*"
  to = "https://sabjis-farm-fresh-delivery-k25g.onrender.com/api/:splat"
  status = 200
  force = true

# Client-side routing fallback for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
